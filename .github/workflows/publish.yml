name: Publish Middle East Brief
on:
  schedule:
    - cron: '0 5 * * *'      # 08:00 بتوقيت الرياض (UTC+3)
    - cron: '0 14 * * *'     # 17:00 بتوقيت الرياض (تحديث مسائي)
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
permissions:
  contents: write
concurrency:
  group: publish-brief
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install feedparser
      - name: Build brief from RSS
        run: python scripts/build_brief.py
      - name: Commit and push if changed
        run: |
          git config user.name "MEB Bot"
          git config user.email "meb-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update Middle East brief (RSS) $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
